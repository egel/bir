[package]
name = "bir"
version = "0.1.0"
edition = "2024"
description = "Bir - bulk image resizer"
license = "Apache-2.0"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"
pkg-config = "0.3"

[features]
default = ["vendored"]
vendored = []

[dependencies]
anyhow = "1.0"
# Pure-Rust AVIF encoder (rav1e), used for `-f avif` output.
# No extra C delegate libraries are required for it.
ravif = "0.13"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
indicatif = "0.18"
indicatif-log-bridge = "0.2"
log = "0.4"
rayon = "1.10"
thiserror = "2.0"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = "symbols"
